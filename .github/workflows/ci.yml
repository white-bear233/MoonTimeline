name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/requirements.txt
      - run: python tools/oracle.py --check
      - run: python tools/generate_time_tests.py --check
  moonbit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [js, native, wasm-gc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moon.sh
          bash /tmp/install-moon.sh 0.10.16+b1a0e846e
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon fmt --check
      - name: Verify reader fixtures are reproducible
        run: |
          python3 tools/generate_reader_tests.py
          moon fmt otio
          git diff --exit-code -- otio/fixtures_test.mbt
      - run: moon check --target ${{ matrix.target }}
      - run: moon build --target ${{ matrix.target }}
      - run: moon test --target ${{ matrix.target }}
      - run: moon run examples/time --target ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/requirements.txt
      - name: Verify official structural oracles are reproducible
        run: |
          python tools/generate_semantic_tests.py
          python tools/generate_opentime_tests.py
          python tools/generate_schema_defaults.py
          python tools/generate_graph_tests.py
          moon fmt conformance
          moon fmt schema
          git diff --exit-code -- conformance/oracle_test.mbt conformance/opentime_test.mbt conformance/graph_test.mbt schema/defaults.mbt schema/defaults_test.mbt schema/color_names.mbt
      - run: python tools/check_roundtrip.py --target ${{ matrix.target }}
      - run: python tools/check_edits.py --target ${{ matrix.target }}
      - if: matrix.target == 'js'
        run: |
          node tools/build-js.mjs
          node --test tests/cli.test.mjs tests/regression.test.mjs
          python tools/check_review.py
          python tools/check_bundles.py
          node --check demo/app.mjs
          node --check tools/serve.mjs
      - if: matrix.target == 'js'
        name: Upstream OTIO sample corpus
        run: node tools/check_external_corpus.mjs
      - if: matrix.target == 'native'
        run: MOONTIMELINE_NATIVE="$PWD/_build/native/debug/build/cmd/native/native.exe" node --test tests/cli.test.mjs
      - if: matrix.target == 'native'
        run: |
          node tools/build-js.mjs
          python tools/check_corpus.py --native "$PWD/_build/native/debug/build/cmd/native/native.exe"
          python tools/check_review.py --native "$PWD/_build/native/debug/build/cmd/native/native.exe"
