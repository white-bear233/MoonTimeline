name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  moonbit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [js, native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moon.sh
          bash /tmp/install-moon.sh 0.10.16+b1a0e846e
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon fmt --check
      - run: moon check --target ${{ matrix.target }}
      - run: moon build --target ${{ matrix.target }}
      - run: moon test --target ${{ matrix.target }}
